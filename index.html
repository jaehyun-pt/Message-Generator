<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밀당PT 특강 멘트 생성기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Hahmlet:wght@600;700&display=swap">
<style>
  :root{
    --bg:#F5F7F4; --surface:#FFFFFF; --surface2:#EDF1EE;
    --ink:#1E2B26; --muted:#64736C; --line:#DCE3DE;
    --accent:#146B52; --on-accent:#FFFFFF; --accent-soft:#E3F0EA; --accent-line:#B9D4C8;
    --danger:#9C4221;
    --shadow:0 1px 2px rgba(30,43,38,.06), 0 4px 16px rgba(30,43,38,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131A16; --surface:#1B2420; --surface2:#212B26;
      --ink:#E9EEEB; --muted:#93A29A; --line:#2B352F;
      --accent:#43C29A; --on-accent:#0A1712; --accent-soft:#1D3229; --accent-line:#2F5546;
      --danger:#E08A5E;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131A16; --surface:#1B2420; --surface2:#212B26;
    --ink:#E9EEEB; --muted:#93A29A; --line:#2B352F;
    --accent:#43C29A; --on-accent:#0A1712; --accent-soft:#1D3229; --accent-line:#2F5546;
    --danger:#E08A5E;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size:14px; line-height:1.55; word-break:keep-all;
  }
  header.app{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    padding:20px 24px 0;
    max-width:1400px; margin:0 auto;
  }
  header.app h1{
    font-family:"Hahmlet", "IBM Plex Sans KR", serif;
    font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em;
  }
  header.app .sub{color:var(--muted); font-size:13px}
  .wrap{
    max-width:1400px; margin:0 auto; padding:16px 24px 40px;
    display:grid; grid-template-columns:330px 300px 1fr; gap:16px; align-items:start;
  }
  @media (max-width:1080px){ .wrap{grid-template-columns:320px 1fr} .col-preview{grid-column:1 / -1} }
  @media (max-width:720px){ .wrap{grid-template-columns:1fr} .col-preview{grid-column:auto} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card .hd{padding:12px 16px 0; font-weight:700; font-size:13px; letter-spacing:.04em; color:var(--muted)}
  .card .bd{padding:12px 16px 16px}

  label.f{display:block; margin-bottom:12px}
  label.f .lab, .lab{display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:5px}
  input[type=text], select, textarea{
    width:100%; font:inherit; color:var(--ink);
    background:var(--surface2); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px;
  }
  textarea{resize:vertical; min-height:110px; line-height:1.7}
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
  }
  .seg{display:flex; gap:0; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .seg button{
    flex:1; font:inherit; padding:7px 4px; border:none; background:var(--surface2); color:var(--muted); cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent); color:var(--on-accent); font-weight:700}
  .hint{font-size:12px; color:var(--muted); margin:4px 0 0}
  .btn{
    font:inherit; cursor:pointer; border-radius:7px; padding:8px 14px;
    border:1px solid var(--line); background:var(--surface2); color:var(--ink);
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700}
  .btn.small{padding:4px 10px; font-size:12px}
  .btn:disabled{opacity:.45; cursor:default}

  /* roster */
  .roster-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 16px 8px}
  .roster-head b{font-variant-numeric:tabular-nums}
  .roster{max-height:520px; overflow-y:auto; border-top:1px solid var(--line)}
  .stu{
    display:flex; align-items:center; gap:8px; padding:8px 12px 8px 14px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .stu:last-child{border-bottom:none}
  .stu:hover{background:var(--surface2)}
  .stu.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
  .stu .nm{flex:1; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .stu .nm .done{color:var(--accent); font-weight:700; margin-right:4px}
  .chip{
    font:inherit; font-size:11px; padding:2px 8px; border-radius:999px; cursor:pointer;
    border:1px solid var(--accent-line); background:var(--surface); color:var(--accent); white-space:nowrap;
  }
  .chip.basic{border-color:var(--line); color:var(--muted)}
  .empty{padding:24px 16px; color:var(--muted); text-align:center; font-size:13px}

  /* preview */
  .pv-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .pv-head .who{font-family:"Hahmlet", serif; font-weight:700; font-size:16px}
  .pv-tags{display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--muted)}
  .pv-tags span{border:1px solid var(--line); border-radius:999px; padding:1px 8px; background:var(--surface2)}
  .pv-body{padding:16px}
  pre.msg{
    margin:0; font:inherit; white-space:pre-wrap; overflow-wrap:anywhere;
    background:var(--surface2); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; max-height:560px; overflow-y:auto; line-height:1.75; font-size:13.5px;
  }
  .pv-actions{display:flex; gap:8px; margin-left:auto}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header class="app">
  <h1>특강 멘트 생성기</h1>
  <span class="sub">2026 수학 2학기 중간고사 대비 · 학부모 안내 메시지</span>
</header>

<div class="wrap">

  <!-- ══════════ 설정 ══════════ -->
  <div class="col-set">
    <div class="card">
      <div class="hd">기본 설정</div>
      <div class="bd">
        <label class="f">
          <span class="lab">선생님 이름</span>
          <input type="text" id="teacher" placeholder="예: 김민지" autocomplete="off">
        </label>
        <div class="f">
          <span class="lab">학년</span>
          <div class="seg" id="segGrade" role="group" aria-label="학년"></div>
        </div>
        <label class="f">
          <span class="lab">시험범위</span>
          <select id="selRange"></select>
          <p class="hint">학교 시험 공지에 맞는 범위를 선택하세요.</p>
        </label>
        <div class="f">
          <span class="lab">기본 수준 (학생별로 개별 변경 가능)</span>
          <div class="seg" id="segLevel" role="group" aria-label="수준"></div>
        </div>
        <label class="f">
          <span class="lab">특강 신청(결제) 링크</span>
          <select id="selPay"></select>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="hd">학생 명단</div>
      <div class="bd">
        <label class="f">
          <span class="lab">이름을 줄바꿈 또는 쉼표로 구분해 붙여넣기 (50명 이상 가능)</span>
          <textarea id="taNames" placeholder="김서준&#10;이하윤&#10;박도현, 최지우, 정시우 …"></textarea>
        </label>
        <div style="display:flex; gap:8px">
          <button class="btn primary" id="btnApply" style="flex:1">명단 적용</button>
          <button class="btn" id="btnClear">비우기</button>
        </div>
        <p class="hint">명단은 이 페이지에 저장되어 다음에 열어도 유지됩니다.</p>
      </div>
    </div>
  </div>

  <!-- ══════════ 학생 목록 ══════════ -->
  <div class="card col-list">
    <div class="roster-head">
      <div><b id="cntDone">0</b><span style="color:var(--muted)"> / </span><b id="cntAll">0</b><span style="color:var(--muted)"> 복사됨</span></div>
      <button class="btn small" id="btnResetCopied">복사 표시 초기화</button>
    </div>
    <div class="roster" id="roster"></div>
  </div>

  <!-- ══════════ 미리보기 ══════════ -->
  <div class="card col-preview">
    <div class="pv-head">
      <span class="who" id="pvName">미리보기</span>
      <div class="pv-tags" id="pvTags"></div>
      <div class="pv-actions">
        <button class="btn primary" id="btnCopy">이 메시지 복사</button>
      </div>
    </div>
    <div class="pv-body">
      <pre class="msg" id="pvMsg"></pre>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

/* ───────────────────── 링크 ───────────────────── */
const PAY_LINKS = {
  high: [
    { id:'hw', label:'고등 주말', url:'https://payment.mildang.kr/VRis-2j9U1gincVs5l-6-' },
    { id:'hd', label:'고등 주간', url:'https://payment.mildang.kr/bpye0i9cFtgsIQXuidTUJ' },
  ],
  middle: [
    { id:'mw', label:'중등 주말', url:'https://payment.mildang.kr/eB1XiJiIXdtX9LK6G722h' },
    { id:'md', label:'중등 주간', url:'https://payment.mildang.kr/yymmlIfBt2-my3RUEWXSR' },
  ],
};

/* ───────────────────── 수준 ───────────────────── */
const LEVELS = [
  { id:'advanced', label:'유형 이상', short:'유형↑' },
  { id:'basic',    label:'연산·개념', short:'연산·개념' },
];

/* ───────────────────── 학년·범위·멘트 데이터 ─────────────────────
   범위 옵션은 2025년 실제 학교별 시험범위 사례를 반영해 세분화.
   · 고1 공통수학2: 평면좌표~집합(대전외고·인천포스코고·인천원당고·대전괴정고),
     평면좌표~도형의 이동(현대고·단대부고), 집합~도형의 이동(휘문고)
   · 고2 미적분Ⅰ형: 함수의 극한 ~ 접선의 방정식(휘문고·양재고·서초고)
   · 중3: 삼각비 ~ 원과 직선(서울삼육중 등)
   각 범위: label(드롭다운), lecture(특강명), rangeText, intro, levels, list, core, goal */

/* ========== 고1 공통 블록 ========== */
const H1_INTRO = (rangeText, extra) => `이번 시험범위(${rangeText})의 최대 난관은 도형의 방정식입니다. 공식 암기로는 풀리지 않고, 그림을 보고 쓸 성질을 스스로 찾아내는 힘이 필요합니다.${extra ? ' ' + extra : ''}`;

const H1_LEVELS = {
  advanced:`응용 문제는 평행선의 넓이비, 각의 이등분선 성질까지 엮여 나와 중등 기하가 탄탄해야 접근이 가능합니다.`,
  basic:`공수2는 공수1의 계산력에 도형 감각까지 요구되어, 개념 이해에 그쳤다면 난도가 급히 올랐다고 느낍니다.`,
};
const H1_LIST = `① 도형·그래프 유형 반복 훈련
② 풀이 방향을 잡는 사고 과정 훈련
③ 타 학교 기출과 고난도 문제 대비`;
const H1_LIST_SET = `① 도형·그래프 유형 반복 훈련
② 집합·명제 빈출 유형 정리
③ 타 학교 기출과 고난도 문제 대비`;
const H1_EXTRA_SET = `여기에 집합까지 포함되어 새 기호·용어를 정확히 다루는 능력도 필요합니다.`;
const H1_EXTRA_PROP = `여기에 집합과 명제까지 포함되어 진리집합·필요충분조건의 정확한 이해도 필요합니다.`;
const H1_EXTRA_PROP_ALL = `여기에 명제의 증명·절대부등식까지 포함되며, 서술형 단골 포인트라 꼼꼼한 대비가 필요합니다.`;
const h1Range = (id, label, rangeText, extra, list) => ({
  id, label, rangeText,
  lecture:'[고1 공통수학2 내신 대비 특강]',
  core:'도형 파트', goal:'어떤 성질을 활용해야 하는지',
  intro:H1_INTRO(rangeText, extra), list:list || H1_LIST, levels:H1_LEVELS,
});

/* ========== 중3 공통 블록 ========== */
const M3_INTRO = (rangeText, extra) => `이번 시험범위(${rangeText})의 최대 난관은 삼각비입니다. 값을 외운다고 풀리지 않고, 그림에서 직각삼각형을 찾거나 보조선을 그어 만드는 힘이 필요합니다.${extra ? ' ' + extra : ''}`;
const M3_LEVELS = {
  advanced:`응용 문제는 삼각비에 닮음·피타고라스까지 엮여 나오고, 고1 도형의 방정식으로 이어집니다.`,
  basic:`피타고라스나 무리수(√) 계산이 익숙하지 않으면 삼각비 값 구하기부터 막혀, 기본기부터 단계를 밟아야 합니다.`,
};
const M3_LIST_TRI = `① 삼각비·도형 유형 반복 훈련
② 직각삼각형을 찾아 풀이 방향을 잡는 훈련
③ 타 학교 기출과 고난도 문제 대비`;
const M3_LIST_CIR = `① 삼각비·원의 성질 유형 반복 훈련
② 직각삼각형과 보조선을 찾는 사고 훈련
③ 타 학교 기출과 고난도 문제 대비`;

/* ========== 고2 미적분Ⅰ 공통 블록 ========== */
const H2M_INTRO = (rangeText, extra) => `이번 시험범위(${rangeText})의 최대 난관은 함수의 극한과 연속입니다. 대입으로 풀리지 않고, 그래프를 읽고 좌·우극한을 나누어 살피는 판단력이 필요합니다.${extra ? ' ' + extra : ''}`;
const H2M_LEVELS = (withDiff) => ({
  advanced:`응용 문제는 ${withDiff ? '극한·연속에 미분계수까지' : '극한과 연속 조건을'} 엮은 합답형·서술형이 많아 공식만으로는 풀리지 않습니다.`,
  basic:`그래프 해석이나 식 변형이 익숙하지 않으면 극한부터 막혀, 기본기부터 단계를 밟아야 합니다.`,
});

/* ========== 고2 대수(지수·로그) 공통 블록 ========== */
const H2A_INTRO = (rangeText, withTrig) => `이번 시험범위(${rangeText})의 최대 난관은 지수·로그함수입니다. 로그 계산은 한 번의 실수로 답이 틀어지고, 그래프의 이동과 조건 해석이 결합돼 접근 순서를 스스로 판단해야 합니다.${withTrig ? ' 여기에 삼각함수 그래프까지 포함됩니다.' : ''}`;
const H2A_LEVELS = (withTrig) => ({
  advanced:`응용 문제는 그래프에 대칭·닮음·넓이비를 엮거나 미지수의 범위를 묻는 등, 공식만으로는 풀리지 않습니다.`,
  basic:`지수법칙이나 그래프 해석이 익숙하지 않으면 지수·로그부터 막혀, 로그 계산 같은 기본기부터 잡아야 합니다.`,
});

/* ========== 중2 공통 블록 (2022 개정 · 도형의 성질) ========== */
const M2_INTRO = (rangeText, extra) => `이번 시험범위(${rangeText})의 최대 난관은 도형의 성질입니다. 그림에서 쓸 성질을 찾아 보조선을 긋는 힘과, 증명 서술형을 논리적으로 쓰는 연습이 필요합니다.${extra ? ' ' + extra : ''}`;
const M2_LEVELS = {
  advanced:`응용 문제는 성질에 합동·각도 추적·넓이 조건까지 엮여 나오고, 중3 닮음·삼각비로 이어집니다.`,
  basic:`계산 중심이던 1학기와 달라, 중1 기본 도형과 합동이 약하면 성질을 적용하는 단계부터 막힙니다.`,
};
/* 닮음 포함 범위용 수준별 문단 — 닮음 비중 강화 */
const M2_LEVELS_SIM = {
  advanced:`특히 닮음은 겹친 도형에서 닮은 삼각형을 찾고 넓이비를 연결하는 문제가 변별력을 가르는 고난도로 출제됩니다.`,
  basic:`닮음은 대응변을 짝지어 비례식을 세우는 기본기가 흔들리면 이후 문제 전체가 막히는 단원입니다.`,
};
const M2_LIST = (first) => `① ${first} 유형 반복 훈련
② 쓸 성질·보조선 찾기와 증명 서술형 훈련
③ 타 학교 기출과 고난도 문제 대비`;
const M2_LIST_SIM = `① 도형의 성질·닮음 유형 반복 훈련
② 닮은 삼각형 찾기와 증명 서술형 훈련
③ 타 학교 기출과 고난도 문제 대비`;

  const runs = raw.match(/[가-힣]+/g);
  if (!runs) return raw;
  const name = runs[runs.length - 1];
  // 성을 떼고 이름만: 3글자 → 뒤 2글자(박수민 → 수민), 2글자 → 뒤 1글자(고은 → 은)
  if (name.length >= 4) return DOUBLE_SURNAMES.includes(name.slice(0, 2)) ? name.slice(2) : name.slice(1);
  if (name.length >= 2) return name.slice(1);
  return name;
}
function josaName(name){
  // 받침 있으면 '이' 붙여 부르기: 수민 → 수민이, 창세 → 창세
  const ch = name.charCodeAt(name.length - 1);
  if (ch >= 0xAC00 && ch <= 0xD7A3 && (ch - 0xAC00) % 28 > 0) return name + '이';
  return name;
}
function buildMessage(o){
  // o: {teacher, grade, range, level, payUrl, student}
  const r = o.range;
  const lv = r.levels[o.level];
  const stu = josaName(givenName(o.student || 'OO'));
  return `안녕하세요, 학부모님. 밀당PT 수학 ${o.teacher || '000'} 선생님입니다.
${r.lecture}이 개설되었습니다.

${r.intro}

${lv}

특강에서는
${r.list}

를 통해 "${r.goal}"를 빠르게 판단하는 힘을 길러드립니다.

${stu}의 효과적인 시험대비를 위해 특강 신청 링크 안내드립니다!
${o.payUrl}`;
}

/* ───────────────────── 상태 ───────────────────── */
const LS_KEY = 'mildang-teukgang-v3';
const DEFAULT_RANGES = { m1:'m1r3', m2:'m2r2', m3:'m3r1', h1:'h1r2', h2:'h2r3' };
let state = {
  teacher:'', gradeId:'h1',
  rangeByGrade:Object.assign({}, DEFAULT_RANGES),
  level:'advanced', payId:{ high:'hw', middle:'mw' },
  students:[], selected:0, namesRaw:'',
};
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (saved && typeof saved === 'object'){
    state = Object.assign(state, saved);
    state.rangeByGrade = Object.assign({}, DEFAULT_RANGES, saved.rangeByGrade);
    state.payId = Object.assign({high:'hw',middle:'mw'}, saved.payId);
    if(!Array.isArray(state.students)) state.students = [];
  }
}catch(e){ /* storage unavailable — run in memory */ }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

const grade = () => GRADES.find(g => g.id === state.gradeId) || GRADES[1];
const range = () => { const g = grade(); return g.ranges.find(r => r.id === state.rangeByGrade[g.id]) || g.ranges[0]; };
const payOpt = () => { const g = grade(); const opts = PAY_LINKS[g.school]; return opts.find(p => p.id === state.payId[g.school]) || opts[0]; };
const stuLevel = s => s.level || state.level;
const lvLabel = id => (LEVELS.find(l => l.id === id) || LEVELS[0]).label;
const lvShort = id => (LEVELS.find(l => l.id === id) || LEVELS[0]).short;

function msgFor(s){
  return buildMessage({
    teacher: state.teacher.trim(), grade: grade(), range: range(),
    level: stuLevel(s), payUrl: payOpt().url, student: s.name,
  });
}

/* ───────────────────── 렌더 ───────────────────── */
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderSegs(){
  const sg = $('segGrade'); sg.innerHTML = '';
  GRADES.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = g.label;
    b.className = g.id === state.gradeId ? 'on' : '';
    b.onclick = () => { state.gradeId = g.id; resetCopied(false); save(); renderAll(); };
    sg.appendChild(b);
  });
  const sl = $('segLevel'); sl.innerHTML = '';
  LEVELS.forEach(l => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = l.label;
    b.className = l.id === state.level ? 'on' : '';
    b.onclick = () => { state.level = l.id; resetCopied(false); save(); renderAll(); };
    sl.appendChild(b);
  });
}
function renderSelects(){
  const g = grade();
  const sr = $('selRange'); sr.innerHTML = '';
  g.ranges.forEach(r => {
    const op = document.createElement('option');
    op.value = r.id; op.textContent = r.label;
    if (r.id === state.rangeByGrade[g.id]) op.selected = true;
    sr.appendChild(op);
  });
  const sp = $('selPay'); sp.innerHTML = '';
  PAY_LINKS[g.school].forEach(p => {
    const op = document.createElement('option');
    op.value = p.id; op.textContent = p.label;
    if (p.id === state.payId[g.school]) op.selected = true;
    sp.appendChild(op);
  });
}
function renderRoster(){
  const box = $('roster'); box.innerHTML = '';
  if (!state.students.length){
    box.innerHTML = '<div class="empty">왼쪽에 학생 명단을 붙여넣고<br>「명단 적용」을 누르세요.</div>';
  }
  state.students.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'stu' + (i === state.selected ? ' sel' : '');
    row.innerHTML = `<span class="nm">${s.copied ? '<span class="done">✓</span>' : ''}${esc(s.name)}</span>`;
    row.onclick = () => { state.selected = i; save(); renderRoster(); renderPreview(); };

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (stuLevel(s) === 'basic' ? ' basic' : '');
    chip.textContent = lvShort(stuLevel(s));
    chip.title = '클릭하여 이 학생의 수준 변경';
    chip.onclick = e => {
      e.stopPropagation();
      s.level = stuLevel(s) === 'advanced' ? 'basic' : 'advanced';
      s.copied = false; save(); renderRoster(); renderPreview();
    };
    row.appendChild(chip);

    const cp = document.createElement('button');
    cp.type = 'button'; cp.className = 'btn small';
    cp.textContent = s.copied ? '재복사' : '복사';
    cp.onclick = e => { e.stopPropagation(); state.selected = i; copyText(msgFor(s), () => { s.copied = true; save(); renderRoster(); renderPreview(); toast(`${s.name} 메시지 복사됨`); }); };
    row.appendChild(cp);
    box.appendChild(row);
  });
  $('cntAll').textContent = state.students.length;
  $('cntDone').textContent = state.students.filter(s => s.copied).length;
}
function renderPreview(){
  const s = state.students[state.selected] || { name:'OO' };
  $('pvName').textContent = s.name === 'OO' ? '미리보기 (학생 미선택)' : s.name;
  const tags = [grade().label, lvLabel(stuLevel(s)), range().rangeText, payOpt().label];
  $('pvTags').innerHTML = tags.map(t => `<span>${esc(t)}</span>`).join('');
  $('pvMsg').textContent = msgFor(s);
}
function renderAll(){ renderSegs(); renderSelects(); renderRoster(); renderPreview(); $('teacher').value = state.teacher; if(document.activeElement !== $('taNames')) $('taNames').value = state.namesRaw; }

function resetCopied(rerender){
  state.students.forEach(s => s.copied = false);
  if (rerender !== false){ save(); renderRoster(); renderPreview(); }
}

/* ───────────────────── 복사 ───────────────────── */
function copyText(text, ok){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let done = false;
    try{ done = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if (done) ok(); else toast('복사에 실패했습니다. 미리보기에서 직접 선택해 주세요.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else fallback();
}
let toastTimer = null;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ───────────────────── 이벤트 ───────────────────── */
$('teacher').addEventListener('input', e => { state.teacher = e.target.value; save(); renderPreview(); });
$('selRange').addEventListener('change', e => { state.rangeByGrade[grade().id] = e.target.value; resetCopied(false); save(); renderAll(); });
$('selPay').addEventListener('change', e => { state.payId[grade().school] = e.target.value; save(); renderPreview(); });
$('taNames').addEventListener('input', e => { state.namesRaw = e.target.value; save(); });
$('btnApply').addEventListener('click', () => {
  const names = state.namesRaw.split(/[\n,、·;]+/).map(t => t.trim()).filter(Boolean);
  const seen = new Set(); const uniq = [];
  names.forEach(n => { if(!seen.has(n)){ seen.add(n); uniq.push(n); } });
  const old = new Map(state.students.map(s => [s.name, s]));
  state.students = uniq.map(n => old.get(n) || { name:n, level:null, copied:false });
  state.selected = 0; save(); renderRoster(); renderPreview();
  toast(`${uniq.length}명 적용됨`);
});
$('btnClear').addEventListener('click', () => {
  state.namesRaw = ''; state.students = []; state.selected = 0; save(); renderAll();
});
$('btnResetCopied').addEventListener('click', () => resetCopied());
$('btnCopy').addEventListener('click', () => {
  const s = state.students[state.selected];
  const text = msgFor(s || { name:'OO' });
  copyText(text, () => {
    if (s){ s.copied = true; save(); renderRoster(); }
    toast(s ? `${s.name} 메시지 복사됨` : '메시지 복사됨');
  });
});

renderAll();
</script>
</body>
</html>
